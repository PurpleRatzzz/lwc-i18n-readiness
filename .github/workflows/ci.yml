name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repos the tests and examples refer to, pinned in targets.json; without them one test is skipped.
      - run: npm run fetch-targets
      - run: npm test
